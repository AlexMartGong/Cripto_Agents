[project]
name = "crypto-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.73",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "ollama>=0.6.2",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
crypto-agents = "crypto_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_agents"]

[dependency-groups]
dev = [
    "hypothesis>=6.165.5",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errores
    "W",    # pycodestyle avisos
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations: type hints completos
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "RUF",  # reglas propias de ruff
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resuelve las anotaciones en runtime: mover sus tipos a TYPE_CHECKING
# rompería la construcción del modelo.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    # ruff no sigue la herencia entre módulos: sin estas dos, los tipos de campo
    # de cualquier modelo que herede de ellas acabarían en TYPE_CHECKING y
    # Pydantic no podría construir la clase.
    "crypto_agents.state.FrozenModel",
    "crypto_agents.state.LLMOutput",
]

[tool.ruff.lint.isort]
# Impone `from __future__ import annotations` en todos los módulos.
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
# ccxt y pandas-ta no publican py.typed ni tienen stubs. pandas sí, vía pandas-stubs.
module = ["ccxt.*", "pandas_ta.*", "ollama.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
