# Que cerrar la tapa no suspenda la laptop mientras está enchufada (deploy/README.md, paso d). Se
# instala en /etc/systemd/logind.conf.d/ con sudo y se aplica en el siguiente arranque.
#
# Sin esto, HandleLidSwitchExternalPower= no tiene valor y logind usa HandleLidSwitch=suspend
# también con el cargador, y lo hace aunque el lote tenga tomado el inhibidor de suspensión
# (LidSwitchIgnoreInhibited=yes por defecto). Con batería, la tapa sigue suspendiendo.
[Login]
HandleLidSwitchExternalPower=ignore
